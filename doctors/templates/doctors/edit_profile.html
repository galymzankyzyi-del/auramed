<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактирование профиля врача</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f5f9fc; padding: 40px 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.07); }
        h2 { color: #159a9c; margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #d0d5dd; border-radius: 8px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #159a9c; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .current-avatar { width: 100px; height: 100px; object-fit: cover; border-radius: 50%; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🩺 Настройка профиля врача</h2>

        {% if form.instance.image %}
            <div style="text-align: center;">
                <img src="{{ form.instance.image.url }}" class="current-avatar" alt="Фото">
            </div>
        {% endif %}

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn">Сохранить изменения</button>
        </form>
    </div>
</body>
</html>
