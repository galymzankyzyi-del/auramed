{% extends 'main/base.html' %}

{% block title %}Редактирование профиля — AuraMed{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        
        <!-- Ссылка назад -->
        <div class="mb-4">
            <a href="{% url 'doctor_dashboard' doctor.id %}" class="text-decoration-none text-muted fw-semibold d-inline-flex align-items-center gap-2">
                <i class="fas fa-arrow-left"></i> Назад в кабинет
            </a>
        </div>

        <div class="bento-card p-4 p-md-5 bg-white rounded-4 shadow-sm border border-light">
            <h1 class="fw-bold mb-4" style="letter-spacing: -1px; color: #111827;">Редактирование профиля</h1>

            <!-- ВАЖНО: enctype="multipart/form-data" необходим для загрузки файлов/фото -->
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold text-dark">ФИО врача</label>
                    <input type="text" class="form-control rounded-4 py-3 px-3 border-light bg-light" id="name" name="name" value="{{ doctor.name }}" required>
                </div>

                <div class="mb-3">
                    <label for="specialization" class="form-label fw-semibold text-dark">Специализация</label>
                    <input type="text" class="form-control rounded-4 py-3 px-3 border-light bg-light" id="specialization" name="specialization" value="{{ doctor.specialization }}" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="experience" class="form-label fw-semibold text-dark">Опыт работы (лет)</label>
                        <input type="number" class="form-control rounded-4 py-3 px-3 border-light bg-light" id="experience" name="experience" value="{{ doctor.experience }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="phone" class="form-label fw-semibold text-dark">Номер телефона</label>
                        <input type="text" class="form-control rounded-4 py-3 px-3 border-light bg-light" id="phone" name="phone" value="{{ doctor.phone }}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="image" class="form-label fw-semibold text-dark">Фотография врача</label>
                    <input type="file" class="form-control rounded-4 py-3 px-3 border-light bg-light" id="image" name="image">
                    {% if doctor.image %}
                        <div class="form-text mt-2">Текущее фото: {{ doctor.image.name }}</div>
                    {% endif %}
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label fw-semibold text-dark">О себе / Описание</label>
                    <textarea class="form-control rounded-4 py-3 px-3 border-light bg-light" id="description" name="description" rows="3">{{ doctor.description }}</textarea>
                </div>

                <button type="submit" class="btn w-100 py-3 fw-bold text-white rounded-pill shadow-sm" style="background-color: #0f172a; transition: all 0.2s;">
                    <i class="fas fa-save me-2"></i> Сохранить изменения
                </button>
            </form>
        </div>

    </div>
</div>
{% endblock %}
